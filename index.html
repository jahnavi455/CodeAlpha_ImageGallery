<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>
    <div class="gallery">

        <img src="images/img1.jpg" class="nature" alt="">
        <img src="images/img2.jpg" class="nature" alt="">
        <img src="images/img3.jpg" class="nature" alt="">
        <img src="images/img4.jpg" class="nature" alt="">
        <img src="images/img5.jpg" class="nature" alt="">
        <img src="images/img6.jpg" class="nature" alt="">

    </div>


    <div class="lightbox">

        <span class="close">&times;</span>

        <button class="prev">&#10094;</button>

        <img class="lightbox-img" src="" alt="">

        <button class="next">&#10095;</button>
        <button class="delete-btn">Delete</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
